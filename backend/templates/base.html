<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALPRO TECHNOLOGY SPA</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #050508;
        --bg-card: rgba(18, 18, 28, 0.9);
        --border: rgba(99, 102, 241, 0.35);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-cyan: #22d3ee;
        --accent-magenta: #e879f9;
      }
      body {
        font-family: "Outfit", system-ui, sans-serif;
        margin: 0;
        color: var(--text);
        background: var(--bg-deep);
        min-height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99, 102, 241, 0.35), transparent),
          radial-gradient(ellipse 60% 40% at 90% 10%, rgba(232, 121, 249, 0.2), transparent),
          #0a0a10;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero {
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.25),
          rgba(34, 211, 238, 0.12),
          rgba(232, 121, 249, 0.15)
        );
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        margin-bottom: 24px;
        box-shadow: 0 0 40px rgba(34, 211, 238, 0.12);
      }
      .brand {
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-weight: 800;
      }
      h1, h2, h3 {
        color: var(--text);
      }
      p {
        color: var(--text-muted);
      }
      .hero-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .services-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 24px rgba(34, 211, 238, 0.15);
      }
      .badge {
        display: inline-block;
        background: linear-gradient(135deg, #22d3ee, #6366f1);
        color: #050508;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 8px;
      }
      .btn {
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        color: #050508;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 4px 20px rgba(34, 211, 238, 0.35);
      }
      .btn-outline {
        background: transparent;
        color: var(--accent-magenta);
        border: 1px solid var(--accent-magenta);
        box-shadow: 0 0 16px rgba(232, 121, 249, 0.2);
      }
      .stats-inline {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .stats-inline strong {
        color: var(--accent-cyan);
        font-size: 1.25rem;
      }
      .vmv-row {
        margin-bottom: 20px;
      }
      .card-vision {
        border-color: rgba(34, 211, 238, 0.45);
      }
      .card-mission {
        border-color: rgba(232, 121, 249, 0.45);
      }
      h3 {
        color: var(--text);
        margin-top: 8px;
      }
      code {
        background: rgba(99, 102, 241, 0.2);
        color: var(--accent-cyan);
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      footer {
        margin-top: 48px;
        font-size: 14px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        padding-top: 16px;
        text-align: center;
      }
      .whatsapp-float {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        z-index: 1000;
        width: 58px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #25d366;
        color: #fff;
        border-radius: 50%;
        box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
        text-decoration: none;
        transition: transform 0.2s;
      }
      .whatsapp-float:hover {
        transform: scale(1.08);
      }
      .whatsapp-float svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <main class="container">
      {% block content %}{% endblock %}
      <footer>
        <p>ALPRO TECHNOLOGY SPA — Servicios tecnologicos e innovacion digital.</p>
        <p>Desarrollo web · Automatizacion · Consultoria · Chile</p>
      </footer>
    </main>
    <a
      href="https://wa.me/56948708980?text=Hola%20ALPRO%2C%20me%20interesa%20una%20consultoria%20tecnologica."
      class="whatsapp-float"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar por WhatsApp al +56948708980"
      title="Escríbenos por WhatsApp"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">

      </svg>
    </a>
  </body>
</html>
